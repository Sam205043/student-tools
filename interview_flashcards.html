<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Q&A Flashcards — Soft Skill Zone Institute</title>
<style>
  :root{--navy:#1F3864;--navy2:#2b4a7e;--orange:#C55A11;--grey:#5b6472;--light:#f2f6fc;--line:#e6ecf6;--green:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eef2f9,#e2e9f5);color:#1c2430;min-height:100vh;padding:16px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:520px}
  .head{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:20px 20px 0 0;padding:22px;color:#fff;text-align:center;position:relative;overflow:hidden}
  .head::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;background:rgba(255,255,255,.06);border-radius:50%}
  .head h1{font-size:21px}.head .tag{font-size:12.5px;opacity:.85;margin-top:4px}
  .card{background:#fff;border-radius:0 0 20px 20px;padding:20px 18px 22px;box-shadow:0 18px 45px rgba(31,56,100,.18)}
  .bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--grey);margin-bottom:12px}
  .cat{background:var(--light);color:var(--navy);padding:4px 12px;border-radius:20px;font-size:12px}
  /* flip card */
  .flip{perspective:1400px;height:340px;margin-bottom:16px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flip.on .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .front{background:linear-gradient(150deg,#22345c,#33507f);color:#fff}
  .back{background:linear-gradient(150deg,#eef7ef,#ffffff);border:2px solid var(--green);color:#1c2430;transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}
  .front .qn{font-size:13px;font-weight:700;color:#ffd9b3;letter-spacing:1px;margin-bottom:14px}
  .front .q{font-size:20px;font-weight:800;line-height:1.4}
  .front .hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;opacity:.8}
  .back .al{font-size:12px;font-weight:800;color:var(--green);letter-spacing:1px;margin-bottom:8px;text-align:left}
  .back .a{font-size:15px;line-height:1.6;text-align:left;color:#2a3444}
  .nav{display:flex;gap:10px}
  .nav button{flex:1;border:0;font-weight:800;font-size:14px;padding:13px;border-radius:12px;cursor:pointer}
  .nav .prev{background:var(--light);color:var(--navy)}
  .nav .next{background:var(--navy);color:#fff}
  .nav .sh{background:var(--orange);color:#fff;flex:none;padding:13px 16px}
  .foot{margin-top:16px;background:var(--navy);border-radius:16px;padding:15px 18px;color:#fff;text-align:center}
  .foot .fn{font-weight:800;font-size:15px}.foot .fr{font-size:12.5px;opacity:.92;margin-top:5px}
  .foot a{color:#fff;text-decoration:none}
  .wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff !important;font-weight:800;padding:10px 18px;border-radius:11px;font-size:13.5px;margin-top:11px}
  .credit{text-align:center;font-size:11px;color:var(--grey);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Interview Q&amp;A Flashcards</h1>
    <div class="tag">Soft Skill Zone Institute • Job Preparation</div>
  </div>
  <div class="card">
    <div class="bar"><span id="pos">1 / 1</span><span class="cat" id="cat">—</span></div>
    <div class="flip" id="flip" onclick="toggle()">
      <div class="inner">
        <div class="face front"><div class="qn" id="qn">QUESTION 1</div><div class="q" id="q">—</div><div class="hint">👆 Tap karo — answer dekho</div></div>
        <div class="face back"><div class="al">✅ ANSWER</div><div class="a" id="a">—</div></div>
      </div>
    </div>
    <div class="nav">
      <button class="prev" onclick="prev(event)">← Prev</button>
      <button class="sh" onclick="shuffle(event)" title="Shuffle">🔀</button>
      <button class="next" onclick="next(event)">Next →</button>
    </div>
  </div>
  <div class="foot">
    <div class="fn">Soft Skill Zone Institute</div>
    <div class="fr">📞 <a href="tel:6202856897">Call / WhatsApp: 6202856897</a> • 📍 Near Gym Town, Pakri, Ara</div>
    <a class="wa" href="https://wa.me/916202856897?text=Hi%2C%20GST%20%2B%20Tally%20course%20join%20karna%20hai" target="_blank" rel="noopener">💬 Course Join karein</a>
  </div>
  <div class="credit">Made by Soft Skill Zone Institute • Author: Pankaj Pandey</div>
</div>
<script>
var QA=[
 ["GST","GST kya hai?","GST (Goods and Services Tax) ek indirect tax hai jo 1 July 2017 se poore India mein laga. Isne VAT, Excise, Service Tax jaise kai taxes ki jagah li — 'One Nation, One Tax'."],
 ["GST","CGST, SGST aur IGST mein farak?","Same state (intra) sale par CGST + SGST (aadha-aadha) lagta hai. Alag state (inter-state) sale par IGST (poora) lagta hai."],
 ["GST","GST 2.0 ke slabs kaun se hain?","0%, 5%, 18% aur 40%. 2025 reform mein 12% aur 28% slab hata diye gaye."],
 ["GST","ITC kya hai?","Input Tax Credit — purchase/expense par bhari GST wapas milti hai. Net GST = Output Tax − ITC."],
 ["GST","Registration ki turnover limit kya hai?","Goods ke liye Rs. 40 lakh aur services ke liye Rs. 20 lakh (normal states). Special category states mein aadhi."],
 ["GST","RCM (Reverse Charge) kya hai?","Reverse Charge Mechanism — GST supplier ki jagah khareedar (receiver) bharta hai. Jaise GTA freight, legal services, unregistered purchase."],
 ["GST","Tax Invoice aur Bill of Supply mein farak?","Tax Invoice regular dealer deta hai (GST alag dikhta hai). Bill of Supply composition dealer / exempt goods ke liye (GST nahi dikhaya jaata)."],
 ["GST","GSTIN mein kitne digits hote hain?","15 digits — pehle 2 state code, agle 10 PAN, 13th entity number, 14th 'Z', 15th check digit."],
 ["GST","Composition scheme kya hai?","Chhote dealers (turnover 1.5 crore tak) ke liye aasaan scheme — kam rate (trader 1%, restaurant 5%, services 6%), par ITC nahi milta."],
 ["GST","Zero-rated supply kya hai?","Export aur SEZ supply — 0% GST par ITC/refund milta hai. Exempt se alag (exempt mein ITC nahi milta)."],
 ["Returns","GSTR-1 aur GSTR-3B mein farak?","GSTR-1 = outward sales ki invoice-wise detail. GSTR-3B = summary return + tax payment. Dono monthly (ya QRMP)."],
 ["Returns","Annual return kaun si hai?","GSTR-9 (annual return) aur GSTR-9C (reconciliation statement, audit) — turnover limit ke upar."],
 ["Returns","GSTR-2B kya hai?","Auto-generated ITC statement — supplier ne jo upload kiya uske hisaab se aapko kitna ITC milega."],
 ["Tally","TallyPrime mein Sales aur Purchase voucher shortcut?","F8 = Sales, F9 = Purchase."],
 ["Tally","Payment, Receipt, Contra, Journal ke shortcuts?","F5 = Payment, F6 = Receipt, F4 = Contra, F7 = Journal."],
 ["Tally","Credit Note aur Debit Note shortcut?","Ctrl+F8 = Credit Note (sales return), Ctrl+F9 = Debit Note (purchase return)."],
 ["Tally","Company Features kholne ka shortcut?","F11 = Features (jaise GST enable karna). F12 = Configure (settings)."],
 ["Tally","'Go To' shortcut kya hai?","Alt+G — kisi bhi report ya master par seedha jump kar sakte ho, bina menu navigate kiye."],
 ["Tally","Contra voucher kis kaam aata hai?","Cash aur Bank (ya do bank accounts) ke beech paisa transfer ke liye — jaise cash bank mein jama karna."],
 ["Tally","Tally mein backup kaise lete hain?","Gateway > Alt+Y (Data) > Backup — company data safe rakhne ke liye. Regular backup zaroori hai."],
 ["Accounting","Debit aur Credit ka rule?","Assets/Expenses badhein to Debit; Income/Liability/Capital badhein to Credit. (Double entry — har entry ke do side.)"],
 ["Accounting","Balance Sheet ka golden rule?","Assets = Liabilities + Capital. Dono side hamesha barabar honi chahiye."],
 ["Accounting","Gross Profit aur Net Profit mein farak?","Gross Profit Trading A/c se (sirf trading). Net Profit P&L A/c se (indirect kharche ghata kar)."],
 ["Accounting","Depreciation kya hai?","Asset ki value har saal ghatna (ghisai/wear-tear). Ye P&L mein expense hai aur asset se ghatti hai."],
 ["Accounting","Capital debit hoti hai ya credit?","Credit. Owner ka lagaya paisa business ke liye liability hai (owner ko dena), isliye Credit."],
 ["Accounting","Debtors aur Creditors mein farak?","Debtors = jinse paisa lena hai (customers, asset). Creditors = jinhe paisa dena hai (suppliers, liability)."],
 ["Accounting","Trial Balance kya batati hai?","Saare ledgers ke closing balance (Dr/Cr). Dono side barabar = entries mathematically sahi."],
 ["Accounting","Closing stock final accounts mein kahan aata hai?","Do jagah — Trading A/c ke Credit side (GP badhata hai) aur Balance Sheet ke Asset side."],
 ["Career","Is course ke baad kaun se job mil sakte hain?","Accountant, GST Executive, Tally Operator, Accounts Assistant, Billing Executive — har business ko ye skills chahiye."],
 ["Career","Interview mein confidence kaise dikhayein?","Practical examples do (jaise 'maine Tally mein GST return banayi hai'), shortcuts pata hon, aur GST 2.0 ke latest rules yaad rakho."]
];
var order=QA.map(function(_,i){return i;});
var idx=0;
function cur(){return QA[order[idx]];}
function show(){
  var d=cur();
  document.getElementById('flip').classList.remove('on');
  document.getElementById('qn').textContent='QUESTION '+(idx+1);
  document.getElementById('q').textContent=d[1];
  document.getElementById('a').textContent=d[2];
  document.getElementById('cat').textContent=d[0];
  document.getElementById('pos').textContent=(idx+1)+' / '+QA.length;
}
function toggle(){document.getElementById('flip').classList.toggle('on');}
function next(e){e.stopPropagation();idx=(idx+1)%QA.length;show();}
function prev(e){e.stopPropagation();idx=(idx-1+QA.length)%QA.length;show();}
function shuffle(e){e.stopPropagation();for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}idx=0;show();}
show();
</script>
</body>
</html>
