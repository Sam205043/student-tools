<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallyPrime Shortcut Keys — Soft Skill Zone Institute</title>
<style>
  :root{--navy:#1F3864;--navy2:#2b4a7e;--orange:#C55A11;--grey:#5b6472;--light:#f2f6fc;--line:#e6ecf6;--purple:#7030A0;--purpfill:#f2ebfa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eef2f9,#e2e9f5);color:#1c2430;min-height:100vh;padding:16px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:520px}
  .head{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:20px 20px 0 0;padding:22px;color:#fff;text-align:center;position:relative;overflow:hidden}
  .head::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;background:rgba(255,255,255,.06);border-radius:50%}
  .head h1{font-size:21px}.head .tag{font-size:12.5px;opacity:.85;margin-top:4px;letter-spacing:.5px}
  .head .pill{display:inline-block;margin-top:12px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:6px 16px;border-radius:30px}
  .card{background:#fff;border-radius:0 0 20px 20px;padding:18px 16px 20px;box-shadow:0 18px 45px rgba(31,56,100,.18)}
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:14px 14px 14px 44px;font-size:16px;font-weight:600;color:var(--navy);border:2px solid var(--line);border-radius:13px;outline:none}
  .search input:focus{border-color:var(--orange)}
  .search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.5}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{border:1.5px solid var(--line);background:#fff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer}
  .filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .count{font-size:12px;color:var(--grey);margin:0 4px 8px;font-weight:600}
  .list{max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .key{flex:none;min-width:96px;text-align:center;font-family:Consolas,monospace;font-weight:800;font-size:13.5px;color:#fff;background:var(--navy);padding:8px 6px;border-radius:8px}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:700;font-size:14px;color:#1c2430}
  .item .meta{font-size:11.5px;color:var(--grey);margin-top:2px}
  .empty{padding:30px;text-align:center;color:var(--grey);font-size:14px}
  .foot{margin-top:16px;background:var(--navy);border-radius:16px;padding:15px 18px;color:#fff;text-align:center}
  .foot .fn{font-weight:800;font-size:15px}.foot .fr{font-size:12.5px;opacity:.92;margin-top:5px}
  .foot a{color:#fff;text-decoration:none}
  .wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff !important;font-weight:800;padding:10px 18px;border-radius:11px;font-size:13.5px;margin-top:11px}
  .credit{text-align:center;font-size:11px;color:var(--grey);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>TallyPrime Shortcut Keys</h1>
    <div class="tag">Soft Skill Zone Institute &nbsp;•&nbsp; TallyPrime 7.0</div>
    <div class="pill">Cheat Sheet — search karo</div>
  </div>
  <div class="card">
    <div class="search"><span class="ic">🔍</span>
      <input id="q" type="text" placeholder="Search — jaise Sales, F9, Print, Go To..." oninput="render()" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="foot">
    <div class="fn">Soft Skill Zone Institute</div>
    <div class="fr">📞 <a href="tel:6202856897">Call / WhatsApp: 6202856897</a> &nbsp;•&nbsp; 📍 Near Gym Town, Pakri, Ara</div>
    <a class="wa" href="https://wa.me/916202856897?text=Hi%2C%20GST%20%2B%20Tally%20course%20ki%20jaankari%20chahiye" target="_blank" rel="noopener">💬 Course Join karein</a>
  </div>
  <div class="credit">Made by Soft Skill Zone Institute • Author: Pankaj Pandey</div>
</div>
<script>
// [key, name, category, keywords]
var DATA=[
 ["F4","Contra Voucher (cash-bank transfer)","V","contra cash bank"],
 ["F5","Payment Voucher","V","payment paisa diya"],
 ["F6","Receipt Voucher","V","receipt paisa mila"],
 ["F7","Journal Voucher","V","journal adjustment"],
 ["F8","Sales Voucher","V","sales bikri invoice"],
 ["Ctrl+F8","Credit Note (sales return)","V","credit note sales return"],
 ["F9","Purchase Voucher","V","purchase khareed"],
 ["Ctrl+F9","Debit Note (purchase return)","V","debit note purchase return"],
 ["F10","Other Vouchers (list)","V","other vouchers"],
 ["Alt+F7","Stock Journal","V","stock journal transfer"],
 ["Alt+F9","Receipt Note (inventory)","V","receipt note grn"],
 ["Alt+F8","Delivery Note (inventory)","V","delivery note"],
 ["F2","Change Date","N","date badlo period"],
 ["Alt+F2","Change Period","N","period range date"],
 ["Alt+G","Go To (kisi report/master par seedha)","N","go to search jump"],
 ["Ctrl+G","Switch To","N","switch change"],
 ["Esc","Peeche jao / Quit screen","N","escape back quit"],
 ["Alt+K","Company menu","N","company create select"],
 ["Alt+Y","Data menu (backup/restore)","N","data backup restore"],
 ["Alt+Z","Exchange / Connect (online)","N","connect online exchange"],
 ["Ctrl+A","Accept / Save","A","accept save ok"],
 ["Ctrl+Q","Quit without saving","A","quit cancel"],
 ["Ctrl+P","Print","A","print"],
 ["Ctrl+E","Export","A","export excel pdf"],
 ["Alt+M","Email","A","email mail"],
 ["Alt+D","Delete","A","delete hatao"],
 ["Alt+X","Cancel Voucher","A","cancel void"],
 ["Alt+2","Duplicate Voucher (Day Book)","A","duplicate copy"],
 ["Alt+A","Add Voucher","A","add"],
 ["Alt+I","Insert Voucher","A","insert"],
 ["Alt+C","Create master (on the fly)","A","create new master"],
 ["Ctrl+Enter","Alter master (from voucher)","A","alter edit master"],
 ["F11","Company Features","C","features f11 enable gst"],
 ["F12","Configure (settings)","C","configure config settings"],
 ["Alt+F1","Detailed view (report)","R","detailed expand report"],
 ["Alt+F5","Quarterly / detailed toggle","R","quarterly detailed"],
 ["Alt+N","Auto column (report)","R","auto column"],
 ["Ctrl+B","Basis of Values (report)","R","basis values"],
 ["Ctrl+H","Change View (report)","R","change view"],
 ["Ctrl+J","Exception Reports","R","exception"],
 ["F1","Help / About","N","help about version"]
];
var CATS=[["all","Sab"],["V","Vouchers"],["N","Navigation"],["A","Actions"],["C","Features"],["R","Reports"]];
var cur="all";
function bf(){document.getElementById('filters').innerHTML=CATS.map(c=>'<button class="'+(c[0]===cur?'on':'')+'" onclick="sc(\''+c[0]+'\')">'+c[1]+'</button>').join('');}
function sc(c){cur=c;bf();render();}
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=DATA.filter(function(d){
    if(cur!=='all'&&d[2]!==cur)return false;
    if(!q)return true;
    return d[0].toLowerCase().indexOf(q)>=0||d[1].toLowerCase().indexOf(q)>=0||d[3].indexOf(q)>=0;
  });
  document.getElementById('count').textContent=rows.length+' shortcut'+(rows.length!==1?'s':'')+' mile';
  var CN={V:'Voucher',N:'Navigation',A:'Action',C:'Feature',R:'Report'};
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">Kuch nahi mila 😕 — doosre naam se try karo.</div>';return;}
  document.getElementById('list').innerHTML=rows.map(function(d){
    return '<div class="item"><div class="key">'+d[0]+'</div><div class="info"><div class="nm">'+d[1]+'</div><div class="meta">'+CN[d[2]]+'</div></div></div>';
  }).join('');
}
bf();render();
</script>
</body>
</html>
