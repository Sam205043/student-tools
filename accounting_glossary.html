<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounting & GST Glossary — Soft Skill Zone Institute</title>
<style>
  :root{--navy:#1F3864;--navy2:#2b4a7e;--orange:#C55A11;--grey:#5b6472;--light:#f2f6fc;--line:#e6ecf6;--green:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eef2f9,#e2e9f5);color:#1c2430;min-height:100vh;padding:16px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:540px}
  .head{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:20px 20px 0 0;padding:22px;color:#fff;text-align:center;position:relative;overflow:hidden}
  .head::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;background:rgba(255,255,255,.06);border-radius:50%}
  .head h1{font-size:21px}.head .tag{font-size:12.5px;opacity:.85;margin-top:4px;letter-spacing:.5px}
  .head .pill{display:inline-block;margin-top:12px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:6px 16px;border-radius:30px}
  .card{background:#fff;border-radius:0 0 20px 20px;padding:18px 16px 20px;box-shadow:0 18px 45px rgba(31,56,100,.18)}
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:14px 14px 14px 44px;font-size:16px;font-weight:600;color:var(--navy);border:2px solid var(--line);border-radius:13px;outline:none}
  .search input:focus{border-color:var(--orange)}
  .search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.5}
  .count{font-size:12px;color:var(--grey);margin:0 4px 8px;font-weight:600}
  .list{max-height:64vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px}
  .item{padding:12px 15px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .t{font-weight:800;font-size:15px;color:var(--navy)}
  .item .d{font-size:13px;color:#3a4250;line-height:1.55;margin-top:3px}
  .empty{padding:30px;text-align:center;color:var(--grey);font-size:14px}
  .foot{margin-top:16px;background:var(--navy);border-radius:16px;padding:15px 18px;color:#fff;text-align:center}
  .foot .fn{font-weight:800;font-size:15px}.foot .fr{font-size:12.5px;opacity:.92;margin-top:5px}
  .foot a{color:#fff;text-decoration:none}
  .wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff !important;font-weight:800;padding:10px 18px;border-radius:11px;font-size:13.5px;margin-top:11px}
  .credit{text-align:center;font-size:11px;color:var(--grey);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Accounting &amp; GST Glossary</h1>
    <div class="tag">Soft Skill Zone Institute &nbsp;•&nbsp; Simple Hinglish</div>
    <div class="pill">Term likho → matlab samjho</div>
  </div>
  <div class="card">
    <div class="search"><span class="ic">🔍</span>
      <input id="q" type="text" placeholder="Search — jaise Debit, Ledger, ITC, Voucher..." oninput="render()" autocomplete="off"></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="foot">
    <div class="fn">Soft Skill Zone Institute</div>
    <div class="fr">📞 <a href="tel:6202856897">Call / WhatsApp: 6202856897</a> &nbsp;•&nbsp; 📍 Near Gym Town, Pakri, Ara</div>
    <a class="wa" href="https://wa.me/916202856897?text=Hi%2C%20GST%20%2B%20Tally%20course%20ki%20jaankari%20chahiye" target="_blank" rel="noopener">💬 Course Join karein</a>
  </div>
  <div class="credit">Made by Soft Skill Zone Institute • Author: Pankaj Pandey</div>
</div>
<script>
var DATA=[
 ["Debit (Dr)","Kisi account ki left side. Asset ya expense badhta hai to debit. Rule: 'jo aaye/kharcha ho' aksar debit."],
 ["Credit (Cr)","Kisi account ki right side. Income, liability ya capital badhta hai to credit. Rule: 'jo jaaye/mile' aksar credit."],
 ["Journal","Har transaction ka pehla record — debit aur credit ke saath. Accounting ki shuruaat yahin se."],
 ["Ledger","Ek account ka poora record (jaise Cash, Verma A/c). Saari entries yahan aakar jama hoti hain."],
 ["Voucher","Transaction ka document/entry Tally mein — Payment, Receipt, Sales, Purchase, Journal, Contra."],
 ["Trial Balance","Saare ledgers ke closing balance ki list (Dr aur Cr). Dono side barabar = entries sahi."],
 ["Trading Account","Gross Profit nikalne ke liye — Sales + Closing Stock minus (Opening Stock + Purchase + Direct Expenses)."],
 ["Profit & Loss A/c","Net Profit nikalne ke liye — Gross Profit minus indirect expenses (salary, rent, etc.)."],
 ["Balance Sheet","Ek din par company ki position — Assets ek taraf, Liabilities + Capital doosri taraf. Dono barabar."],
 ["Assets","Company ke paas jo hai — Cash, Bank, Stock, Machinery, Debtors. (Business ki 'jaayedaad'.)"],
 ["Liabilities","Company par jo dena hai — Loan, Creditors, Outstanding expenses."],
 ["Capital","Owner ka lagaya paisa business mein. Business ke liye ye liability (owner ko dena) hoti hai — Credit."],
 ["Drawings","Owner ne business se apne personal use ke liye nikala paisa/maal. Capital se ghatta hai."],
 ["Depreciation","Asset ki value har saal ghatna (ghisai). Jaise machine/van purani hoti hai to value kam. P&L expense."],
 ["Debtors (Sundry Debtors)","Wo customers jinse paisa lena baaki hai (aapne udhaar becha). Asset."],
 ["Creditors (Sundry Creditors)","Wo suppliers jinhe paisa dena baaki hai (aapne udhaar khareeda). Liability."],
 ["Opening Balance","Saal ki shuruaat mein har account ka balance (pichhle saal se aaya)."],
 ["Closing Stock","Saal ke ant mein bacha hua maal (cost par). Trading A/c aur Balance Sheet dono mein aata hai."],
 ["Gross Profit","Sirf maal bechne se hua profit (Trading Account se). Indirect kharche ghatane se pehle."],
 ["Net Profit","Saare kharche ghatane ke baad ka asli profit (P&L Account se). Capital mein judta hai."],
 ["Contra Voucher","Cash aur Bank (ya do bank) ke beech paisa transfer — F4. Isme GST/party nahi."],
 ["GST","Goods and Services Tax — ek hi tax jo VAT, Excise, Service Tax ki jagah aaya (1 July 2017)."],
 ["CGST","Central GST — same state (intra) sale par lagta hai, aadha hissa. Central govt ko."],
 ["SGST","State GST — same state sale par doosra aadha hissa. State govt ko."],
 ["IGST","Integrated GST — alag state (inter-state) sale par poora tax."],
 ["ITC (Input Tax Credit)","Purchase/expense par bhari GST wapas milti hai — output tax se ghata sakte ho."],
 ["Output Tax","Sale par customer se li gayi GST (jo govt ko deni hai)."],
 ["Input Tax","Purchase par aapne jo GST bhari (jiska ITC milta hai)."],
 ["GSTIN","15-digit GST number — pehle 2 digit state code, phir 10-digit PAN, baaki entity/check."],
 ["HSN Code","Goods (maal) ka standard code jisse GST rate aur classification tay hota hai."],
 ["SAC Code","Services ka standard code (Services Accounting Code) — HSN jaisa, par services ke liye."],
 ["RCM (Reverse Charge)","Ulta niyam — GST supplier ki jagah khareedar (receiver) bharta hai. Jaise GTA, legal service."],
 ["TCS","Tax Collected at Source — e-commerce operator (Flipkart/Amazon) seller ki sale par 0.5% kaatta hai."],
 ["Composition Scheme","Chhote dealers ke liye aasaan scheme — kam rate (1%/5%/6%), par ITC nahi, Bill of Supply dete hain."],
 ["Tax Invoice","Regular GST dealer ka bill jisme GST alag dikhta hai (CGST/SGST/IGST)."],
 ["Bill of Supply","Composition dealer / exempt goods ka bill — isme GST nahi dikhaya jaata."],
 ["Credit Note","Sale return ya value kam karne par diya jaata hai — output tax ghatata hai (Ctrl+F8)."],
 ["Debit Note","Purchase return ya value badhane par — ITC ghatata hai (Ctrl+F9)."],
 ["E-way Bill","Rs. 50,000+ ke maal ko ek jagah se doosri jagah bhejne ka online document."],
 ["E-invoice","Bade dealers ke liye portal-verified invoice (QR ke saath). Turnover limit ke upar zaroori."],
 ["GSTR-1","Outward sales ki detail wali monthly/quarterly return."],
 ["GSTR-3B","Summary return — output tax, ITC aur net payment. Monthly."],
 ["GSTR-2B","Auto-generated ITC statement — supplier ne jo upload kiya uske hisaab se."],
 ["GSTR-9","Annual return — poore saal ka summary."],
 ["CMP-08","Composition dealer ki quarterly return."],
 ["Reconciliation","Books aur portal (GSTR-2B) ke data ko milaana — mismatch/galti pakadna."],
 ["Electronic Cash Ledger","Portal par jama kiya paisa (tax bharne ke liye)."],
 ["Electronic Credit Ledger","Aapka ITC balance portal par."],
 ["Financial Year","1 April se 31 March tak ka accounting saal (jaise FY 2026-27)."],
 ["Golden Rule","Balance Sheet ka niyam: Assets = Liabilities + Capital. Hamesha barabar."],
 ["Stock / Inventory","Bechne wala maal jo aapke paas hai. Stock summary Tally report deti hai."]
];
DATA.sort(function(a,b){return a[0].localeCompare(b[0]);});
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=DATA.filter(function(d){return !q||d[0].toLowerCase().indexOf(q)>=0||d[1].toLowerCase().indexOf(q)>=0;});
  document.getElementById('count').textContent=rows.length+' term'+(rows.length!==1?'s':'')+' mile';
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">Kuch nahi mila 😕 — doosre shabd se try karo.</div>';return;}
  document.getElementById('list').innerHTML=rows.map(function(d){return '<div class="item"><div class="t">'+d[0]+'</div><div class="d">'+d[1]+'</div></div>';}).join('');
}
render();
</script>
</body>
</html>
